<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>望长盈 · 现金配置</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18201d;
      --muted: #68716c;
      --line: #dfe4e1;
      --paper: #f7f8f6;
      --surface: #ffffff;
      --cash: #2878a5;
      --shadow: 0 1px 2px rgba(20, 32, 27, .04), 0 8px 24px rgba(20, 32, 27, .05);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    .topbar {
      position: sticky;
      z-index: 10;
      top: 0;
      border-bottom: 1px solid rgba(223, 228, 225, .9);
      background: rgba(247, 248, 246, .92);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: min(1120px, calc(100% - 32px));
      min-height: 68px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--cash);
      color: white;
      font-family: Georgia, serif;
      font-size: 20px;
    }

    .brand strong { display: block; font-size: 16px; }
    .brand span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

    .icon-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      text-decoration: none;
    }

    .icon-button:hover { border-color: #b7c1bc; background: #fbfcfb; }
    .icon-button svg { width: 18px; height: 18px; }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) 500px;
      align-items: center;
      gap: 40px;
      margin-bottom: 34px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 600;
    }

    .subtitle {
      max-width: 430px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .ratio {
      margin-top: 24px;
      color: var(--cash);
      font-family: Georgia, "Songti SC", serif;
      font-size: 24px;
      font-weight: 600;
    }

    .allocation-widget { width: 500px; height: 380px; }
    .allocation-chart { width: 500px; height: 380px; display: block; overflow: visible; }
    .allocation-chart circle { fill: none; stroke-width: 20; }
    .allocation-track { stroke: #edf1ee; }
    .allocation-segment { transform: rotate(-90deg); transform-origin: 50% 50%; transition: opacity .2s ease; }
    .allocation-segment:hover { opacity: .72; }
    .allocation-label-line { stroke: var(--line); stroke-width: 1; }
    .allocation-label { fill: var(--muted); font-size: 10px; font-weight: 650; }
    .allocation-label-value { fill: var(--ink); font-size: 9px; }

    .allocation-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--line);
      box-shadow: var(--shadow);
    }

    .allocation-item {
      min-width: 0;
      padding: 20px;
      background: var(--surface);
    }

    .allocation-item-header { display: flex; align-items: center; gap: 9px; }
    .swatch { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 2px; }
    .allocation-name { font-size: 13px; font-weight: 650; }
    .allocation-value { margin-top: 18px; font-family: Georgia, serif; font-size: 28px; font-weight: 600; }
    .allocation-value small { color: var(--muted); font-size: 13px; }
    .allocation-share { margin-top: 7px; color: var(--muted); font-size: 12px; }

    .note {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 820px) {
      .intro { grid-template-columns: 1fr; gap: 8px; }
      .intro-copy { text-align: center; }
      .subtitle { margin-inline: auto; }
      .allocation-widget { margin: 0 auto; }
      .allocation-list { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .topbar-inner { min-height: 62px; width: min(100% - 24px, 1120px); }
      main { width: min(100% - 24px, 1120px); padding-top: 28px; }
      .allocation-widget { width: 100%; height: 320px; }
      .allocation-chart { width: 100%; height: 320px; }
      .allocation-list { grid-template-columns: 1fr; }
      .allocation-item { padding: 17px 18px; }
      .allocation-value { margin-top: 12px; font-size: 24px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="mark">现</div>
        <div><strong>望长盈</strong><span>现金配置系统</span></div>
      </div>
      <a href="/" class="icon-button" title="返回资产配置总览" aria-label="返回资产配置总览">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
    </div>
  </header>

  <main>
    <section class="intro">
      <div class="intro-copy">
        <h1>从容有度。</h1>
        <p class="subtitle">以期限阶梯分配现金，在保持日常流动性的同时，兼顾中长期资金安排。</p>
        <div class="ratio" aria-label="现金期限配置比例">3 : 1 : 1 : 1</div>
      </div>
      <div class="allocation-widget" id="allocationDonut" aria-label="现金期限配置占比"></div>
    </section>

    <section class="allocation-list" aria-label="现金配置明细">
      <div class="allocation-item">
        <div class="allocation-item-header"><span class="swatch" style="background:#1d5c7a"></span><span class="allocation-name">三年期</span></div>
        <div class="allocation-value">50<small>%</small></div>
        <div class="allocation-share">3 份</div>
      </div>
      <div class="allocation-item">
        <div class="allocation-item-header"><span class="swatch" style="background:#2878a5"></span><span class="allocation-name">两年期</span></div>
        <div class="allocation-value">16.67<small>%</small></div>
        <div class="allocation-share">1 份</div>
      </div>
      <div class="allocation-item">
        <div class="allocation-item-header"><span class="swatch" style="background:#4a9fd8"></span><span class="allocation-name">一年期</span></div>
        <div class="allocation-value">16.67<small>%</small></div>
        <div class="allocation-share">1 份</div>
      </div>
      <div class="allocation-item">
        <div class="allocation-item-header"><span class="swatch" style="background:#79b9d9"></span><span class="allocation-name">活期</span></div>
        <div class="allocation-value">16.67<small>%</small></div>
        <div class="allocation-share">1 份</div>
      </div>
    </section>

    <p class="note">各期限按 3:1:1:1 分配；百分比展示保留两位小数，环形图按原始份数精确绘制。</p>
  </main>

  <script>
    function renderAllocationDonut() {
      const container = document.querySelector('#allocationDonut');
      if (!container) return;

      const cashTerms = [
        { name: '三年期', shares: 3, color: '#1d5c7a' },
        { name: '两年期', shares: 1, color: '#2878a5' },
        { name: '一年期', shares: 1, color: '#4a9fd8' },
        { name: '活期', shares: 1, color: '#79b9d9' }
      ];
      const totalShares = cashTerms.reduce((total, term) => total + term.shares, 0);
      const center = 190;
      const radius = 95;
      const labelRadius = 150;
      const circumference = 2 * Math.PI * radius;
      let offset = 0;

      const segments = cashTerms.map(term => {
        const normalized = term.shares / totalShares;
        const percentage = normalized * 100;
        const length = normalized * circumference;
        const startAngle = -90 + offset / circumference * 360;
        const midAngle = startAngle + normalized * 180;
        const radians = midAngle * Math.PI / 180;
        const lineStartRadius = radius + 5;
        const lineEndRadius = labelRadius - 12;
        const lineStartX = center + Math.cos(radians) * lineStartRadius;
        const lineStartY = center + Math.sin(radians) * lineStartRadius;
        const lineEndX = center + Math.cos(radians) * lineEndRadius;
        const lineEndY = center + Math.sin(radians) * lineEndRadius;
        const labelX = center + Math.cos(radians) * labelRadius;
        const labelY = center + Math.sin(radians) * labelRadius;
        const anchor = Math.cos(radians) >= 0 ? 'start' : 'end';
        const displayPercentage = Number.isInteger(percentage) ? percentage.toFixed(0) : percentage.toFixed(2);

        const segment = `<circle class="allocation-segment" cx="${center}" cy="${center}" r="${radius}" stroke="${term.color}" stroke-dasharray="${length.toFixed(3)} ${(circumference - length).toFixed(3)}" stroke-dashoffset="${(-offset).toFixed(3)}"><title>${term.name} ${displayPercentage}%</title></circle>`;
        const label = `<line class="allocation-label-line" x1="${lineStartX.toFixed(1)}" y1="${lineStartY.toFixed(1)}" x2="${lineEndX.toFixed(1)}" y2="${lineEndY.toFixed(1)}"></line><text class="allocation-label" x="${labelX.toFixed(1)}" y="${(labelY - 1).toFixed(1)}" text-anchor="${anchor}">${term.name}</text><text class="allocation-label-value" x="${labelX.toFixed(1)}" y="${(labelY + 11).toFixed(1)}" text-anchor="${anchor}">${displayPercentage}%</text>`;

        offset += length;
        return segment + label;
      }).join('');

      container.innerHTML = `<svg class="allocation-chart" viewBox="-15 0 410 380" role="img" aria-label="现金期限配置占比环形图"><circle class="allocation-track" cx="190" cy="190" r="95"></circle>${segments}</svg>`;
    }

    renderAllocationDonut();
  </script>
</body>
</html>
